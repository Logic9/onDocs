<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>onDocs AI Demo</title>
  <style>
    :root {
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;
      --gray-900: #0f172a;
      --gray-800: #1e293b;
      --gray-700: #334155;
      --gray-600: #475569;
      --gray-500: #64748b;
      --gray-400: #94a3b8;
      --gray-200: #e2e8f0;
      --gray-100: #f1f5f9;
      --gray-50: #f8fafc;
      --bg: radial-gradient(circle at 20% 20%, #f8fbff, #ffffff 45%);
      --accent: #10b981;
      --radius: 14px;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--gray-900);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--blue-100); color: var(--gray-900); }
    a { color: inherit; text-decoration: none; }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      z-index: 20;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      background: var(--blue-600);
      color: #fff;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.18);
    }
    .badge, .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--gray-200);
      font-size: 12px;
      color: var(--gray-600);
      background: var(--gray-50);
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge.active {
      background: var(--blue-50);
      color: var(--blue-600);
      border-color: var(--blue-100);
    }
    .toggle-btn, .icon-btn {
      border: none;
      background: transparent;
      border-radius: 999px;
      padding: 8px;
      cursor: pointer;
      color: var(--gray-500);
      transition: 0.2s ease;
      min-width: 36px;
    }
    .toggle-btn.active, .icon-btn.active {
      background: var(--blue-50);
      color: var(--blue-600);
    }
    .main {
      display: flex;
      flex: 1;
      padding-top: 64px;
      min-height: 0;
    }
    .chat {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      transition: all 0.35s ease;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 26px 20px;
      scroll-behavior: smooth;
      background: #fff;
    }
    .message {
      background: var(--gray-50);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--gray-800);
      margin-bottom: 12px;
      max-width: 720px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }
    .message.user {
      background: #fff;
      border-color: rgba(37, 99, 235, 0.18);
      color: var(--gray-900);
      margin-left: auto;
    }
    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--gray-500);
      padding: 8px 10px;
    }
    .dots span {
      display: inline-block;
      width: 6px; height: 6px;
      margin-right: 4px;
      background: var(--gray-400);
      border-radius: 50%;
      animation: blink 1.4s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    .input-bar {
      border-top: 1px solid var(--gray-200);
      padding: 14px 16px;
      background: #fff;
      display: grid;
      gap: 10px;
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      box-shadow: 0 -6px 18px rgba(15,23,42,0.05);
    }
    .input-bar textarea {
      width: 100%;
      min-height: 66px;
      resize: vertical;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      transition: 0.2s ease;
      font-family: inherit;
      background: var(--gray-50);
    }
    .input-bar textarea:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }
    .input-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 14px;
    }
    .btn.primary { background: linear-gradient(90deg, var(--blue-600), var(--blue-500)); color: #fff; box-shadow: 0 12px 36px rgba(37,99,235,0.24); }
    .btn.secondary { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-200); }
    .btn:active { transform: translateY(1px); }
    .viewer {
      width: 45%;
      min-width: 320px;
      border-left: 1px solid var(--gray-200);
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s ease, opacity 0.35s ease;
      box-shadow: var(--shadow);
    }
    .viewer.hidden {
      transform: translateX(100%);
      opacity: 0;
    }
    .viewer header {
      position: static;
      height: auto;
      padding: 14px 18px;
      border-bottom: 1px solid var(--gray-200);
      gap: 12px;
    }
    .viewer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .card { background: #fff; border: 1px solid rgba(226,232,240,0.9); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
    .risk-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-700);
      border: 1px solid var(--gray-200);
      background: var(--gray-50);
      margin: 4px 6px 0 0;
    }
    .risk-chip.high { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
    .risk-chip.caution { color: #d97706; border-color: #fde68a; background: #fffbeb; }
    .page { border: 1px solid var(--gray-200); background: #fff; border-radius: 12px; padding: 14px; display: grid; gap: 8px; position: relative; cursor: pointer; box-shadow: 0 10px 28px rgba(15,23,42,0.04); }
    .page.active { border-color: var(--blue-600); box-shadow: 0 0 0 3px rgba(37,99,235,0.12), 0 12px 30px rgba(15,23,42,0.08); }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(59, 130, 246, 0.08);
      border: 2px dashed var(--blue-600);
      display: grid;
      place-items: center;
      z-index: 30;
      pointer-events: none;
      font-weight: 700;
      color: var(--blue-600);
    }
    .status-toast {
      position: fixed;
      top: 80px;
      right: 16px;
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.08);
      font-size: 13px;
      color: var(--gray-700);
      z-index: 25;
      min-width: 240px;
    }
    .hidden { display: none; }
    .muted { color: var(--gray-500); }
    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--gray-700);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .fake-highlight {
      background: linear-gradient(90deg, #fff9c4, #fffbeb, #fff9c4);
      padding: 2px 4px;
      border-radius: 6px;
    }
    .mobile-dimmer {
      display: none;
    }
    .fab {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: 54px;
      height: 54px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 18px 42px rgba(37,99,235,0.32);
      cursor: pointer;
      display: none;
      z-index: 22;
    }
    .fab:active { transform: translateY(1px); }
    @media (max-width: 1024px) {
      .viewer { width: 55%; }
    }
    @media (max-width: 768px) {
      .app { height: auto; min-height: 100vh; }
      body { overflow: auto; }
      .main { flex-direction: column; height: auto; }
      .chat { min-height: 70vh; }
      .chat-body { padding: 18px 14px 20px; }
      .input-bar { padding: 12px 14px; border-radius: 0; box-shadow: 0 -10px 30px rgba(15,23,42,0.08); }
      .message { font-size: 13.5px; }
      .btn { width: 100%; justify-content: center; text-align: center; }
      .input-actions { flex-direction: column; align-items: stretch; }
      .viewer {
        position: fixed;
        inset: 64px 0 0 0;
        width: 100%;
        min-width: unset;
        z-index: 15;
        border-radius: 18px 18px 0 0;
        border-left: none;
        border-top: 1px solid var(--gray-200);
        box-shadow: 0 -8px 30px rgba(15,23,42,0.14);
      }
      .mobile-dimmer {
        display: block;
        position: fixed;
        inset: 64px 0 0 0;
        background: rgba(0,0,0,0.2);
        backdrop-filter: blur(2px);
        z-index: 14;
      }
      .fab { display: grid; place-items: center; }
      header { padding: 0 14px; }
      .badge { max-width: 140px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <div class="logo-mark">AI</div>
        <div>
          <div style="font-weight:800; font-size:14px; color:var(--gray-900);">onDocs AI</div>
          <div style="font-size:11px; color:var(--gray-500); font-weight:600;">Universal Document Analysis</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div id="fileBadge" class="badge">
          <span style="display:inline-flex; width:8px; height:8px; background:var(--gray-400); border-radius:50%;"></span>
          <span id="fileLabel">문서 없음</span>
        </div>
        <button id="toggleViewer" class="toggle-btn" title="문서 뷰어 토글">👁️</button>
      </div>
    </header>

    <div id="statusToast" class="status-toast hidden"></div>

    <div id="dragOverlay" class="overlay hidden">파일을 여기에 놓으면 즉시 분석을 시작합니다</div>

    <div class="main">
      <section class="chat" id="chatSection">
        <div id="chatBody" class="chat-body"></div>
        <div class="input-bar">
          <textarea id="chatInput" placeholder="문서 내용이나 독소 조항을 물어보세요. (예: 이 계약서에서 해지 관련 위험이 있나요?)"></textarea>
          <div class="input-actions">
            <label class="btn secondary" style="cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
              📄 PDF 업로드
              <input id="fileInput" type="file" accept=".pdf,.txt,.md" style="display:none;" />
            </label>
            <button id="sendBtn" class="btn primary">질문 보내기</button>
            <span id="statusText" class="muted" style="font-size:13px;"></span>
          </div>
        </div>
      </section>

      <section id="viewer" class="viewer">
        <header>
          <div class="logo" style="gap:8px;">
            <div style="background:var(--blue-50); color:var(--blue-600); padding:8px; border-radius:10px;">📑</div>
            <div style="font-weight:800; color:var(--gray-800); font-size:14px;">문서 뷰어</div>
          </div>
          <button id="closeViewer" class="toggle-btn">✕</button>
        </header>
        <div class="viewer-body" id="viewerBody">
          <div class="card" id="riskBoard" style="display:none;">
            <div class="section-title">특이사항 리포트</div>
            <div id="riskChips"></div>
          </div>
          <div id="pagesContainer" class="viewer-body" style="padding:0; gap:10px;"></div>
        </div>
      </section>
      <div id="mobileDimmer" class="mobile-dimmer hidden"></div>
    </div>

    <button id="fabUpload" class="fab" aria-label="Upload PDF">+</button>
  </div>

  <script>
    const state = {
      fileName: "",
      status: "",
      showViewer: true,
      isDragging: false,
      isThinking: false,
      messages: [],
      pages: [],
      risks: [],
      activePage: null,
    };

    const chatBody = document.getElementById("chatBody");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const fileInput = document.getElementById("fileInput");
    const fileBadge = document.getElementById("fileBadge");
    const fileLabel = document.getElementById("fileLabel");
    const statusText = document.getElementById("statusText");
    const statusToast = document.getElementById("statusToast");
    const dragOverlay = document.getElementById("dragOverlay");
    const viewer = document.getElementById("viewer");
    const toggleViewer = document.getElementById("toggleViewer");
    const closeViewer = document.getElementById("closeViewer");
    const riskBoard = document.getElementById("riskBoard");
    const riskChips = document.getElementById("riskChips");
    const pagesContainer = document.getElementById("pagesContainer");
    const mobileDimmer = document.getElementById("mobileDimmer");
    const fabUpload = document.getElementById("fabUpload");

    function setStatus(text, toast = false) {
      state.status = text;
      statusText.textContent = text;
      if (toast) {
        statusToast.textContent = text;
        statusToast.classList.remove("hidden");
        setTimeout(() => statusToast.classList.add("hidden"), 2200);
      }
    }

    function renderMessages() {
      chatBody.innerHTML = "";
      state.messages.forEach((m) => {
        const el = document.createElement("div");
        el.className = "message " + (m.role === "user" ? "user" : "");
        el.innerHTML = m.content;
        chatBody.appendChild(el);
      });
      if (state.isThinking) {
        const think = document.createElement("div");
        think.className = "thinking";
        think.innerHTML = '<span class="dots"><span></span><span></span><span></span></span> 분석 중...';
        chatBody.appendChild(think);
      }
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function renderViewer() {
      if (!state.showViewer) {
        viewer.classList.add("hidden");
        mobileDimmer.classList.add("hidden");
      } else {
        viewer.classList.remove("hidden");
        mobileDimmer.classList.remove("hidden");
      }
      riskBoard.style.display = state.risks.length ? "block" : "none";
      riskChips.innerHTML = "";
      state.risks.forEach((r) => {
        const chip = document.createElement("span");
        chip.className = "risk-chip " + (r.risk_level === "High" ? "high" : "caution");
        chip.textContent = `${r.category} · P.${r.page_number}`;
        riskChips.appendChild(chip);
      });
      pagesContainer.innerHTML = "";
      if (!state.pages.length) {
        const empty = document.createElement("div");
        empty.className = "card";
        empty.innerHTML = '<div class="muted" style="text-align:center; padding:20px;">문서 내용이 여기에 표시됩니다.</div>';
        pagesContainer.appendChild(empty);
        return;
      }
      state.pages.forEach((p) => {
        const page = document.createElement("div");
        page.className = "page" + (p.page_number === state.activePage ? " active" : "");
        page.onclick = () => { state.activePage = p.page_number; renderViewer(); };
        const head = document.createElement("div");
        head.style.display = "flex";
        head.style.justifyContent = "space-between";
        head.style.alignItems = "center";
        head.innerHTML = `<span class="pill">Page ${p.page_number}</span><span class="muted" style="font-size:12px;">${p.hasRisk ? "⚠️ 독소 조항 탐지" : ""}</span>`;
        const body = document.createElement("div");
        body.style.fontSize = "14px";
        body.style.lineHeight = "1.6";
        body.innerHTML = p.content;
        page.appendChild(head);
        page.appendChild(body);
        pagesContainer.appendChild(page);
      });
    }

    function setFile(fileName) {
      state.fileName = fileName;
      fileBadge.classList.add("active");
      fileLabel.textContent = fileName;
      toggleViewer.classList.remove("hidden");
    }

    function simulateAnalyze(fileName) {
      setFile(fileName);
      setStatus("업로드 중...", true);
      state.messages = [{ role: "bot", content: "파일을 불러오고 있습니다. 잠시만 기다려주세요." }];
      renderMessages();
      state.showViewer = false;
      renderViewer();
      setTimeout(() => setStatus("텍스트 추출 & 토크나이징...", true), 700);
      setTimeout(() => {
        setStatus("독소 조항 감지 중...", true);
        state.isThinking = true;
        renderMessages();
      }, 1200);
      setTimeout(() => {
        const dummyPages = [
          {
            page_number: 1,
            content: `계약의 목적과 범위를 요약했습니다. <span class="fake-highlight">상대방 해지 권한</span>이 광범위하니 주의가 필요합니다.`,
            hasRisk: true,
          },
          {
            page_number: 2,
            content: `비밀유지와 손해배상 조항이 포함됩니다. 연체료는 <span class="fake-highlight">월 4%</span>로 기재되어 있습니다.`,
            hasRisk: true,
          },
          {
            page_number: 3,
            content: `기타 일반 조항이며, 분쟁 관할은 공급자 소재지로 지정되어 있습니다.`,
            hasRisk: false,
          },
        ];
        const dummyRisks = [
          { page_number: 1, category: "일방적 해지", risk_level: "High" },
          { page_number: 2, category: "과도한 위약금/제한", risk_level: "Caution" },
          { page_number: 3, category: "불공정 관할", risk_level: "Caution" },
        ];
        state.pages = dummyPages;
        state.risks = dummyRisks;
        state.activePage = 1;
        state.isThinking = false;
        state.showViewer = true;
        state.messages = [{
          role: "bot",
          content: "<b>분석 완료!</b> 문서의 주요 위험 요소를 찾았습니다. 궁금한 내용을 질문해보세요.",
        }];
        setStatus("분석 완료", true);
        renderMessages();
        renderViewer();
      }, 2100);
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      state.messages.push({ role: "user", content: text });
      state.isThinking = true;
      renderMessages();

      setTimeout(() => {
        const refPage = state.pages[0]?.page_number || 1;
        state.messages.push({
          role: "bot",
          content: `질문에 대한 답변입니다. P.${refPage}을 참조하세요.<br/><ul style="padding-left:18px; margin:6px 0;"><li>주요 위험: 일방적 해지 가능성</li><li>연체료 조건은 월 4%로 확인되었습니다.</li><li>분쟁 관할은 공급자 소재지입니다.</li></ul>`,
        });
        state.isThinking = false;
        state.activePage = refPage;
        state.showViewer = true;
        renderMessages();
        renderViewer();
      }, 900);
    }

    sendBtn.onclick = sendMessage;
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    fileInput.onchange = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      simulateAnalyze(file.name);
    };

    fabUpload.onclick = () => fileInput.click();

    toggleViewer.onclick = () => {
      state.showViewer = !state.showViewer;
      toggleViewer.classList.toggle("active", state.showViewer);
      renderViewer();
    };
    closeViewer.onclick = () => { state.showViewer = false; renderViewer(); };
    mobileDimmer.onclick = () => { state.showViewer = false; renderViewer(); };

    document.addEventListener("dragover", (e) => {
      e.preventDefault();
      dragOverlay.classList.remove("hidden");
    });
    document.addEventListener("dragleave", (e) => {
      e.preventDefault();
      if (e.target === document || e.target === document.body) {
        dragOverlay.classList.add("hidden");
      }
    });
    document.addEventListener("drop", (e) => {
      e.preventDefault();
      dragOverlay.classList.add("hidden");
      const file = e.dataTransfer.files?.[0];
      if (file) simulateAnalyze(file.name);
    });

    // 초기 메시지
    state.messages = [
      {
        role: "bot",
        content: "<b>환영합니다!</b> PDF를 업로드하면 독소 조항을 감지하고, 요약 및 Q&A를 제공합니다. 샘플로 테스트해보세요.",
      },
    ];
    renderMessages();
    renderViewer();
  </script>
